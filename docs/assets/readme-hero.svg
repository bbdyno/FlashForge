<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">FlashForge 2.0</title>
  <desc id="description">FlashForge's Colour Field design: a study card on a loose pile of pastel sheets, with the line "Remember what matters."</desc>
  <rect width="1200" height="630" fill="#E6D6FA"/>
  <rect x="0.75" y="0.75" width="1198.5" height="628.5" fill="none" stroke="#161513" stroke-width="1.5"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#161513">
    <rect x="80" y="92" width="318" height="40" rx="20" fill="#FFFDF8" stroke="#161513" stroke-width="1.5"/>
    <text x="100" y="118" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Private flashcards for iPhone and iPad</text>
    <text x="76" y="256" font-size="104" letter-spacing="-3">Remember</text>
    <text x="76" y="358" font-size="104" letter-spacing="-3">what matters.</text>
    <text x="80" y="424" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600">Spaced repetition that fits your memory.</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">
      <rect x="80" y="476" width="118" height="36" rx="18" fill="none" stroke="#161513" stroke-width="1.5"/><text x="99" y="499">No account</text>
      <rect x="208" y="476" width="130" height="36" rx="18" fill="none" stroke="#161513" stroke-width="1.5"/><text x="227" y="499">Works offline</text>
      <rect x="348" y="476" width="122" height="36" rx="18" fill="none" stroke="#161513" stroke-width="1.5"/><text x="367" y="499">Free to start</text>
    </g>
  </g>

  <g transform="translate(770 120)" stroke="#161513" stroke-width="1.5">
    <rect width="340" height="330" rx="26" fill="#E0EE9C" transform="rotate(4 170 165) translate(0 -12)"/>
    <rect width="340" height="330" rx="26" fill="#FFD0B0" transform="rotate(-3 170 165) translate(0 -7)"/>
    <rect width="340" height="330" rx="26" fill="#FFFDF8"/>
    <rect x="24" y="24" width="58" height="26" rx="13" fill="none"/>
    <text x="37" y="42" stroke="none" fill="#161513" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">NEW</text>
    <text x="24" y="92" stroke="none" fill="#5F5A52" font-family="Georgia, serif" font-style="italic" font-size="18">English Vocabulary · adjective</text>
    <text x="24" y="146" stroke="none" fill="#161513" font-family="Georgia, serif" font-size="46" letter-spacing="-1">ubiquitous</text>
    <text x="24" y="188" stroke="none" fill="#161513" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="500">present or found everywhere</text>
    <g transform="translate(0 360)">
      <rect x="0" width="79" height="50" rx="16" fill="#FFFDF8"/>
      <rect x="87" width="79" height="50" rx="16" fill="#FFFDF8"/>
      <rect x="174" width="79" height="50" rx="16" fill="#161513"/>
      <rect x="261" width="79" height="50" rx="16" fill="#FFFDF8"/>
      <g stroke="none" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
        <text x="39.5" y="30" fill="#161513">Again</text><text x="126.5" y="30" fill="#161513">Hard</text><text x="213.5" y="30" fill="#FFFDF8">Good</text><text x="300.5" y="30" fill="#161513">Easy</text>
      </g>
    </g>
  </g>
</svg>
