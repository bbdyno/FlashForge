<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">FlashForge 1.2</title>
  <desc id="description">FlashForge's dark editorial Today screen with warm stacked study cards.</desc>
